# PalPulse Control Centre - Home Assistant built-in Lovelace dashboard.
#
# Installation: Settings > Dashboards > Add dashboard > New dashboard from
# scratch > Create > Edit dashboard > Raw configuration editor.
# Paste this file and replace EVERY occurrence of YOURMAC with the lower-case
# 12-hex-digit Powerpal MAC without colons, e.g. d8a5d6d91964.
#
# This template never runs imports. Use PalPulse > Configure for safe
# Preview / confirmation / backup-first Import, Resume and Undo.
# If any sensor entity is absent, select the corresponding real ID from
# Settings > Devices & services > PalPulse > Entities.
title: PalPulse Control Centre
views:
  - title: Electricity
    path: electricity
    icon: mdi:lightning-bolt
    cards:
      - type: markdown
        content: |
          ## PalPulse Control Centre
          Live Powerpal electricity history and costs.
          Historical data comes from Recorder statistics, not a fabricated sensor.
          **Billing is experimental.** Confirm prices and free periods against your retailer.
      - type: grid
        columns: 2
        square: false
        cards:
          - type: statistic
            entity: palpulse:powerpal_YOURMAC_energy
            name: Energy today
            icon: mdi:lightning-bolt
            period:
              calendar:
                period: day
            stat_type: change
          - type: statistic
            entity: palpulse:powerpal_YOURMAC_cost
            name: Electricity cost today
            icon: mdi:cash
            period:
              calendar:
                period: day
            stat_type: change
      - type: statistics-graph
        title: Daily electricity usage
        entities:
          - entity: palpulse:powerpal_YOURMAC_energy
            name: Energy (kWh)
        period: day
        days_to_show: 14
        stat_types:
          - change
        chart_type: bar
      - type: statistics-graph
        title: Daily electricity usage costs
        entities:
          - entity: palpulse:powerpal_YOURMAC_cost
            name: Usage cost
        period: day
        days_to_show: 14
        stat_types:
          - change
        chart_type: bar
      - type: entities
        title: Live PalPulse status
        entities:
          - entity: sensor.palpulse_live_history_status
            name: Energy importer
          - entity: sensor.palpulse_cost_import_status
            name: Cost importer

  - title: History
    path: history
    icon: mdi:database-clock
    cards:
      - type: markdown
        content: |
          ## Past electricity readings
          Need to bring over readings from another integration?
          Open **Settings > Devices & services > PalPulse for Home
          Assistant > Configure > History and migration**.

          Start with the read-only preview. Review your data and take
          a Home Assistant backup including Recorder before importing
          or undoing anything. Historical gaps are not automatically
          filled.

  - title: Pricing
    path: pricing
    icon: mdi:cash-clock
    cards:
      - type: markdown
        content: |
          ## Electricity prices
          Check your electricity rates and free-power window under
          **PalPulse > Configure > Electricity prices**.

          Your plan's daily supply charge is part of the configured
          cost calculation. The separate daily supply sensor is optional
          and hidden from the standard device page.

          **Early preview.** Compare estimated charges with your
          retailer's bill. An incomplete hour may remain unpriced.
