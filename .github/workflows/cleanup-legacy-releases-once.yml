name: One-time cleanup of obsolete PalPulse releases

on:
  push:
    branches:
      - housekeeping/remove-obsolete-palpulse-releases
    paths:
      - .github/workflows/cleanup-legacy-releases-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only the eight explicitly selected old releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "iamhasantan/palpulse-homeassistant" ]] ||
             [[ "$GITHUB_REF" != "refs/heads/housekeeping/remove-obsolete-palpulse-releases" ]]; then
            echo "::error::Unexpected repository or branch; refusing cleanup"
            exit 1
          fi

          newest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/0.2b1" --jq .tag_name)"
          if [[ "$newest" != "0.2b1" ]]; then
            echo "::error::0.2b1 release is missing, no cleanup performed"
            exit 1
          fi

          # Exact GitHub release ID plus corresponding tag. Preserve Git tags.
          while read -r release_id expected_tag; do
            [[ -z "$release_id" ]] && continue
            if ! existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .tag_name 2>/dev/null)"; then
              echo "Already removed: $expected_tag"
              continue
            fi
            if [[ "$existing" != "$expected_tag" ]]; then
              echo "::error::Release ID $release_id unexpectedly resolves to $existing; refusing deletion"
              exit 1
            fi
            echo "Deleting obsolete release $expected_tag (id $release_id)"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id" --silent
          done <<'OLD_RELEASES'
          441848450 0.1.0b15
          439261364 0.1.0b14
          438786737 0.1.0b13
          438727739 0.1.0b12
          438683252 0.1.0b11
          438633735 0.1.0b10
          438305350 0.1.0b9
          435343793 0.1.0b8
          OLD_RELEASES

          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          [[ "$latest" == "0.2b1" ]] || {
            echo "::error::Latest release unexpectedly changed to $latest"
            exit 1
          }
          echo "Old published releases removed; 0.2b1 preserved; Git tags unchanged."
