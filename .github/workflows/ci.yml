name: Validate PalPulse Home Assistant
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: palpulse-ha-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate JSON and Python syntax
        run: |
          python -m compileall -q custom_components tests
          python -m json.tool custom_components/palpulse/manifest.json >/dev/null
          python -m json.tool custom_components/palpulse/strings.json >/dev/null
          python -m json.tool custom_components/palpulse/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null
      - name: Check sidebar JavaScript syntax and button actions
        run: |
          node --check custom_components/palpulse/frontend/palpulse-panel.js
          node tests/test_sidebar_clicks.cjs
      - name: Accounting regression tests
        run: python -m unittest discover -s tests -v
